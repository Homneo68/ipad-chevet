name: Mise à jour de l'écran

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ecran
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: pip install -r scripts/requirements.txt

      - name: Récupérer météo, agenda et photos
        run: python scripts/recuperer.py
        env:
          ICLOUD_ALBUM_URL: ${{ secrets.ICLOUD_ALBUM_URL }}
          ICLOUD_CALENDAR_URL: ${{ secrets.ICLOUD_CALENDAR_URL }}

      - name: Enregistrer les nouvelles photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A photos data/photos.json
          if ! git diff --cached --quiet; then
            git commit -m "Photos mises à jour"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: deploy
        uses: actions/deploy-pages@v4
